<script>
const {activities,days}={"activities":[["riverside-walk","Riverside Walk","Temple of Sinawava · Zion Canyon","family","1","2.2 mi round trip","1½–2 hr","$0 extra · Zion entry applies","Virgin River views|Towering canyon walls|Flexible turnaround","photo-1","Hikers beside autumn foliage on the Riverside Walk","NPS / Abi Farish","https://www.nps.gov/thingstodo/hike-riverside-walk.htm","Zion Canyon Visitor Center, Springdale UT","Start at the visitor center early and ride the free canyon shuttle to stop 9. Use the restrooms before heading out. Follow the paved path beside the Virgin River, then turn back at the pavement’s end or earlier if the kids are ready.","Mostly paved with uneven sections, sand and minor drop-offs. The NPS visitor guide lists about 69 ft of elevation change and 2.2 miles round trip, while the trail page rounds the one-way distance to 1 mile. Allow extra time for shuttle queues.","Bring layers, water, snacks and shoes with grip. A stroller may work on the flatter first stretch if conditions are good. Stay on the path and out of the river. If ice or a closure limits access, try a short Pa’rus outing if clear."],["canyon-overlook","Canyon Overlook","East side of Zion–Mount Carmel Tunnel","adult","2","1.0 mi round trip","1–2 hr","$0 extra · Zion entry applies","Big canyon panorama|Sandstone steps|Views above Pine Creek","photo-2","Three hikers on rock overlooking Zion Canyon","NPS · Public domain","https://www.nps.gov/thingstodo/hike-canyon-overlook.htm","Canyon Overlook Trailhead, Zion National Park","Aim for an early daylight stop if roads and rocks are dry. Use a legal parking space near the east tunnel portal and the pit toilets before starting. Climb the steps, cross the rocky ledges, then return the same way.","About 154 ft of measured gain on the NPS trail page. Narrow rock, stairs and exposed edges make this an adult subgroup pick. Parking is extremely limited. Check tunnel and vehicle restrictions before driving.","Wear grippy shoes and carry layers and water. Skip in ice or if legal parking is full. Swap to a shorter Pa’rus walk if conditions there are good. Keep the cliffside route out of the kids’ plan."],["coral-pink","Coral Pink Sand Dunes","Utah State Park · Near Kanab","family","0","Flexible roaming","1–2 hr","$15 / vehicle · $25 / sled or board","Pink dunes|Optional sand sledding|Big open views","photo-3","Pink sand dunes in southern Utah","Jeff Hollett · CC0","https://stateparks.utah.gov/parks/coral-pink/","Coral Pink Sand Dunes State Park, Kanab UT","Start at the visitor center for restrooms and rental availability. Explore a short section on foot first. If conditions and group energy are good, rent a sit-down sled and pick a gentle slope away from motorized traffic.","Soft sand makes climbs slower. Keep children close and use nonmotorized areas. Park lists daylight opening hours. Rentals are first come, first served, and must be returned 30 minutes before the visitor center closes.","Pack layers, eye protection for wind, and water. If it’s too windy or cold, skip the dunes and switch to a verified Kanab indoor option. Check holiday visitor center hours and rental suitability before driving."]],"days":[["Tue","24","Austin to Las Vegas","Evening flight as reported. Las Vegas overnight plan is open."],["Wed","25","Las Vegas to Orderville","Allow time for rental pickup. Allow time for groceries and the drive after dark. Utah is one hour ahead."],["Thu","26","A slow Thanksgiving","East Zion scenery, an easy family outing if conditions allow, and a relaxed dinner. Canyon Overlook is an optional adult split."],["Fri","27","The big canyon day","Proposed 6:30–7:00 AM Mountain departure. Visitor center → shuttle → Riverside Walk → Zion Lodge break. Pa’rus is the fallback if clear."],["Sat","28","Bryce Canyon day trip","Visitor Center, Sunset Point and Sunrise Point, weather permitting."],["Sun","29","Return to Las Vegas","Checkout and head to LAS for the return flight. Protect time for rental return, holiday traffic and security."]]};
const [river,overlook,dunes]=activities;
activities.push(...[["east-zion","East Zion Scenic Drive","UT-9 · Zion east entrance","family","0","Flexible stops","45–90 min with stops","$0 extra · Zion entry applies","Layered sandstone|Checkerboard Mesa pullout|Easy photo stops","photo-4","Layered sandstone along Zion’s east side","NPS / Caitlin Ceci · East Zion scenery","https://www.nps.gov/zion/index.htm","Checkerboard Mesa Viewpoint, Utah","Drive UT-9 in daylight and stop at signed pullouts only. Start with Checkerboard Mesa and keep this outing short before dinner.","Stay away from traffic. No restrooms at Checkerboard Mesa. Use facilities before leaving and check NPS tunnel vehicle restrictions plus UDOT.","Bring jackets and snacks. If roads are unsafe, stay near base and keep the holiday meal as the anchor.","Main plan"],["pa-rus","Pa’rus Trail","Zion Canyon Visitor Center","family","1","3.5 mi round trip, or shorter","30–60 min short outing","$0 extra · Zion entry applies","Paved path|River bridges|Watchman views","photo-5","Paved Pa’rus Trail leading toward a sandstone peak","NPS","https://www.nps.gov/thingstodo/hike-pa-rus-trail.htm","Zion Canyon Visitor Center, Springdale UT","Start at the visitor center and walk 15–30 minutes out, then return. Extend only if the group wants more.","Paved shared trail with about 50 ft elevation change per the NPS information guide. Yield to bikes and supervise children near the river. Restrooms at the visitor center.","Bring stroller if useful, layers, and shoes with grip. If icy, substitute a visitor center stop.","Family fallback"],["lower-emerald","Lower Emerald Pool","Zion Lodge · Shuttle stop 5","family","1","1.2 mi round trip via Lodge","1–1½ hr","$0 extra · Zion entry applies","Sandstone alcove|Seasonal water|Short lodge outing","photo-6","Upper Emerald Pools, shown for regional context","NPS / Ally ORullian · Upper pool shown","https://www.nps.gov/zion/planyourvisit/zion-canyon-trail-descriptions.htm","Zion Canyon Visitor Center, Springdale UT","From the Lodge, use the crosswalk and bridge if the route is open. Follow signs to the lower pool and return the same way.","Rough paving, minor drop-offs and potentially slick rock. NPS spring guide lists about 150 ft of elevation change. Restrooms and water at the Lodge. Supervise children closely.","Skip if icy, wet underfoot, or access changes. Use Pa’rus instead. Stay out of the pools.","Optional · conditions apply"],["upper-emerald","Upper Emerald Pool","Zion Lodge or The Grotto","adult","2","About 3 mi round trip via Lodge","2–2½ hr","$0 extra · Zion entry applies","Cliff amphitheater|Sandy ascent|Canyon views","photo-6","Visitors near Upper Emerald Pool and its sandstone cliff","NPS / Ally ORullian","https://www.nps.gov/thingstodo/hike-upper-emerald-pools.htm","Zion Canyon Visitor Center, Springdale UT","Start from the Lodge if access permits and follow the signed connections. The Grotto approach via Kayenta changes the distance.","Rock, sand, stairs and exposure. NPS mileage varies with the approach and whether the connector is included. Restrooms at the Lodge.","Use grippy shoes and skip exposed or icy sections. Choose Lower Emerald Pool or Pa’rus as conditions allow.","Optional adult split"],["scout-lookout","Scout Lookout","The Grotto · Shuttle stop 6","adult","3","About 4.2 mi round trip","3–4 hr","$0 extra · Zion entry applies","Walter’s Wiggles|High canyon views|Turnaround before chains","photo-7","Hiker on Scout Lookout facing Angels Landing","NPS","https://www.nps.gov/thingstodo/hike-to-scout-lookout.htm","Zion Canyon Visitor Center, Springdale UT","Ride to The Grotto and hike West Rim Trail to Scout Lookout. Turn around at the junction before the chains.","Roughly 1,000 ft elevation change, steep switchbacks and long drop-offs. Use restrooms at The Grotto before setting out. No Angels Landing permit needed to stop at Scout Lookout.","Bring layers, water and traction appropriate to conditions. Skip if icy or if a late start would threaten the shuttle return.","Optional adult split"],["angels-landing","Angels Landing","The Grotto · Shuttle stop 6","adult","3","About 5.4 mi round trip","4–5 hr","Zion entry + permit fees","Chain-assisted ridge|Big exposure|Summit views","photo-8","Hiker holding the chains on Angels Landing","NPS","https://www.nps.gov/zion/planyourvisit/angels-landing-hiking-permits.htm","Zion Canyon Visitor Center, Springdale UT","Start at The Grotto, climb to Scout Lookout, and continue onto the chain section only with a valid permit and suitable conditions.","Steep exposed cliffs and narrow rock. NPS lists a $6 application fee plus $3 per person if awarded. Use restrooms at The Grotto before departure.","Skip for any ice, strong wind, discomfort with exposure, or missing permit. Scout Lookout is an option only if its own conditions are suitable.","Permit required · off core plan"],["narrows","The Narrows","Temple of Sinawava · Shuttle stop 9","adult","3","Flexible · up to 9.4 mi round trip","Varies · up to 8 hr","Zion entry · winter gear rental extra","Slot canyon walls|Virgin River|Turnaround route","photo-9","Virgin River framed by red sandstone in the Narrows","NPS","https://www.nps.gov/zion/planyourvisit/thenarrows.htm","Zion Canyon Visitor Center, Springdale UT","Ride to stop 9 and follow Riverside Walk to the end. The route beyond enters the river. Treat the paved approach as the default outing.","Cold moving water, slippery rocks, flash-flood potential and cyanobacteria alerts. No permit for the usual bottom-up day route within the permitted day-hike limit. Restrooms at stop 9.","Choose the river route only with suitable winter equipment, current official clearance and experienced adults. Otherwise turn around at the pavement.","Off core plan · winter conditions"],["watchman","Watchman Trail","Zion Canyon Visitor Center","adult","2","3.3 mi round trip","2–3 hr if reopened","$0 extra · Zion entry applies","Watchman viewpoint|Lower canyon|Springdale views","photo-10","View toward the Watchman from the t const parks = {All:"All parks", Zion:"Zion", Bryce:"Bryce Canyon"};
let explorerPark = "All";

function filterButtons(values, attribute, selected) {
 return Object.entries(values).map(([key, value]) =>
  `<button type="button" data-${attribute}="${key}" aria-pressed="${key === selected}">${value}</button>`
 ).join("");
}

function explorer(fixedPark){
 const park = fixedPark || explorerPark;
 const {audience} = filters[park];
 const parkFilter = fixedPark ? "" : `
  <fieldset class="filter-group">
   <legend>Park</legend>
   <div class="filter-buttons">${filterButtons(parks, "park-choice", park)}</div>
  </fieldset>`;
 return `<section class="wrap" id="adventures" data-park="${park}" ${fixedPark ? "data-fixed-park" : ""}>
  <h2 id="explorer-title" tabindex="-1">${fixedPark ? "Explore Bryce Canyon" : "Explore Zion &amp; Bryce"}</h2>
  <div class="explorer-filters" ${fixedPark ? "data-fixed-park" : ""}>
   ${parkFilter}
   <fieldset class="filter-group">
    <legend>Who’s coming?</legend>
    <div class="filter-buttons">${filterButtons(audiences, "audience", audience)}</div>
   </fieldset>
   <label class="filter-difficulty"><span>Difficulty</span>
    <select id="rank"><option value="all">Any difficulty</option><option value="1">Rank 1 · Easy</option><option value="2">Rank 2 · Moderate</option><option value="3">Rank 3 · Strenuous</option><option value="0">Non-hike outings</option></select>
   </label>
  </div>
  <p id="count" class="muted" role="status"></p>
  <div class="grid" id="cards"></div>
 </section>`;
}

function update(){
 const explorerSection = main.querySelector("section[data-park]");
 if (!explorerSection) return;
 const {park} = explorerSection.dataset;
 const {audience, rank} = filters[park];
 const outings = {All:[...activities, ...bryceActivities], Zion:activities, Bryce:bryceActivities}[park];
 const filtered = outings.filter(a => (audience === "all" || audience === a[3]) && (rank === "all" || rank === a[4]));
 explorerSection.querySelectorAll("[data-audience]").forEach(button => {
  button.setAttribute("aria-pressed", String(button.dataset.audience === audience));
 });
 explorerSection.querySelectorAll("[data-park-choice]").forEach(button => {
  button.setAttribute("aria-pressed", String(button.dataset.parkChoice === park));
 });
 explorerSection.querySelector("#rank").value = rank;
 explorerSection.querySelector("#count").textContent = filtered.length + (filtered.length === 1 ? " outing" : " outings") + (park === "All" ? " across both parks" : " · " + parks[park]);
 explorerSection.querySelector("#cards").innerHTML = filtered.length
  ? filtered.map(card).join("")
  : '<p>No outings match these filters. <button type="button" data-reset-filters>Clear filters</button></p>';
}

function videoPlayer(id, title, start){
 const suffix = start ? "&amp;t=" + start + "s" : "";
 const player = location.protocol === "file:" ? "" :
  `<iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${id}${start ? "?start=" + start : ""}" title="${title}" allow="encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
 return player + `<p><a href="https://www.youtube.com/watch?v=${id}${suffix}">Watch on YouTube →</a></p>`;
}

function watchVideo(id){
 const bryce = bryceVideos[id];
 if (bryce) {
  const [videoId, title, creator, start] = bryce;
  return `<section class="guide-video"><h2>${title}</h2><p class="muted">${creator}</p>${videoPlayer(videoId, title, start)}<p class="muted">Trail footage for planning. Check National Park Service alerts for current conditions.</p></section>`;
 }
 const official=officialVideos[id];
 if(official){
  const activity=activities.find(a=>a[0]===id);

 const v=videos[id];if(!v)return "";

}

function setupHeroVideo(){
 const video = main.querySelector(".hero-motion");
 const toggle = main.querySelector(".hero-toggle");
 video.addEventListener("play", () => {
  video.classList.add("is-playing");
  toggle.textContent = "Pause background video";
 });
 video.addEventListener("pause", () => {
  video.classList.remove("is-playing");
  toggle.textContent = "Play background video";
 });
 toggle.addEventListener("click", async () => {
  if (!video.paused) {
   video.pause();
   return;
  }
  if (!video.hasAttribute("src")) video.src = "assets/zion-sunset.mp4";
  try {
   await video.play();
  } catch {
   toggle.textContent = "Retry background video";
  }
 });
}

 else if(route==="kids"){main.innerHTML="<section class=\"wrap guide\"><p class=\"eyebrow\">Two children under five · Family planning</p><h1 tabindex=\"-1\">Kids Essentials</h1><p>Plan one main outing each day and keep an easy exit. Pa’rus is a good starting point. Riverside Walk is an option when the path is clear.</p><h2>1. Before leaving home</h2><ul><li>Bring or reserve a car seat for each child. Choose it by age, size and manufacturer limits. Practice fitting it and confirm the rental vehicle can accommodate both seats.</li><li>For paid tours, verify minimum age, approved restraints, seat capacity and cancellation terms directly with the operator before booking.</li><li>Pack layers, a windproof outer layer, spare socks and clothes, water, familiar snacks, diapers or toilet supplies as needed, and a small first-aid kit.</li></ul><h2>2. Before each outing</h2><ul><li>Check park alerts, weather and roads. Choose paved or sheltered options if exposed trails are icy, wet or windy.</li><li>Set a public meetup and turnaround time. If adults split off, name who is staying with each child and agree on when to reunite.</li><li>Plan restrooms before boarding. NPS says you must be able to load your stroller on the front shuttle rack yourself. Have another adult supervise the children while you load it.</li></ul><h2>3. On the trail</h2><ul><li>Keep children within reach near riverbanks, drop-offs and traffic. Keep them out of the Virgin River. Use a suitable carrier only where footing and terrain are appropriate.</li><li>Take a warm-up, snack or restroom break early. Turn back if kids are cold or tired, footing gets slippery, or daylight is running short.</li><li>Keep Canyon Overlook, Scout Lookout, Angels Landing and river wading out of the young-kids plan. Download maps and agree on a meetup before leaving cell service.</li></ul><div class=\"actions\"><a class=\"button\" href=\"#guide/pa-rus\">Pa’rus guide</a><a class=\"button\" href=\"#guide/riverside-walk\">Riverside guide</a><a class=\"button\" href=\"https://www.nhtsa.gov/vehicle-safety/car-seats-and-booster-seats\">NHTSA car seat guide</a><a class=\"button\" href=\"https://www.nps.gov/zion/planyourvisit/zion-canyon-shuttle-system.htm\">Shuttle and stroller rules</a><a class=\"button\" href=\"https://www.nps.gov/zion/planyourvisit/conditions.htm\">Zion conditions</a></div></section>";}

  render(true);
 }

 }
 update();
});
main.addEventListener("change", event => {
 if (event.target.id === "rank") {
  const park = event.target.closest("[data-park]").dataset.park;
  filters[park].rank = event.target.value;
  update();
 }
 if (event.target.id === "video-choice") {
  main.querySelector("#selected-video").innerHTML = watchVideo(event.target.value);
 }
});
main.addEventListener("error",event=>{
 const img=event.target;
 if(img.tagName!=="IMG")return;
 if(img.closest(".hero")){img.hidden=true;return;}
 const fallback=document.createElement("span");
 fallback.className="photo-missing";
 fallback.textContent="Image unavailable · "+img.alt;
 img.replaceWith(fallback);
},true);
window.addEventListener("hashchange", () => {
 if (mobileMenu.open) mobileMenu.close();
 render(true);
});
render(false);
</script>
</body>
</html>
